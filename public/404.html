<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback (spa-github-pages): GitHub Pages отдаёт этот
      // файл на любой путь, для которого нет файла на диске (например прямой
      // заход на /about). Сохраняем путь в sessionStorage и уходим на главную,
      // где скрипт восстановления в index.html вернёт его через
      // history.replaceState — так BrowserRouter получает нужный маршрут без
      // настоящего 404 и без "#" в адресе.
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash)
      location.replace('/')
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Art Station</title>
    <script>
      // Выставляем тему до отрисовки, чтобы не мигало светлым при загрузке.
      (function () {
        try {
          var t = localStorage.getItem('artstation-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
