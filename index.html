<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Данные о событиях (coverImage/gallery/video) хранят пути без ведущего
      "/" (например "images/events/.../cover.webp"). Раньше это работало,
      потому что HashRouter всегда держал реальный путь документа "/" — со
      значимой частью после "#". С BrowserRouter путь документа становится
      настоящим ("/events/some-id"), и без базового URL браузер резолвил бы
      такие относительные пути от текущей глубины (получая
      "/events/images/..."). base href="/" фиксирует резолвинг всех
      относительных ссылок к корню сайта независимо от глубины маршрута.
    -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <title>Art Station</title>
    <script>
      // GitHub Pages SPA fallback (spa-github-pages): 404.html сохранил
      // исходный путь в sessionStorage перед редиректом на index.html —
      // возвращаем его через history.replaceState до того, как BrowserRouter
      // прочитает location при первом рендере.
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        if (redirect) {
          sessionStorage.removeItem('spa-redirect')
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect)
          }
        }
      })()
    </script>
    <script>
      // Выставляем тему до отрисовки, чтобы не мигало светлым при загрузке.
      (function () {
        try {
          var t = localStorage.getItem('artstation-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
